<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="robots" content="noindex">
<title>Sign-in callback</title>
<style>
  :root { --bg: #fafaf7; --fg: #1d1d1b; --muted: #66665f; --box: #ffffff; --line: #d9d9d2; --accent: #2f5d50; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ecece6; --muted: #a3a39b; --box: #22221f; --line: #3a3a35; --accent: #8cc4b0; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 1.3rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 16px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 9em; padding: 12px; border: 1px solid var(--line);
             border-radius: 8px; background: var(--box); color: var(--fg); font: 13px/1.4 ui-monospace, monospace; word-break: break-all; }
  button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--bg);
           font: inherit; font-weight: 600; cursor: pointer; }
  .err { color: #c0392b; }
</style>
</head>
<body>
<main>
  <h1 id="title">Sign-in finished</h1>
  <p id="msg">Copy the text below and paste it back into your Claude session. It only works once, for a few minutes, and only together with a secret that never left your server.</p>
  <textarea id="out" readonly></textarea>
  <button id="copy" type="button">Copy</button>
</main>
<script>
  var q = new URLSearchParams(location.search);
  var out = document.getElementById("out");
  if (q.get("error")) {
    document.getElementById("title").textContent = "Sign-in did not finish";
    document.getElementById("msg").className = "err";
    document.getElementById("msg").textContent = "The server returned an error. Paste this back into your Claude session:";
  } else if (!q.get("code")) {
    document.getElementById("title").textContent = "Nothing to copy";
    document.getElementById("msg").textContent = "This page is the end of a sign-in. Open it through the sign-in link, not directly.";
  }
  out.value = location.href;
  document.getElementById("copy").onclick = function () {
    out.select();
    (navigator.clipboard ? navigator.clipboard.writeText(out.value) : Promise.reject()).catch(function () { document.execCommand("copy"); });
    this.textContent = "Copied";
  };
</script>
</body>
</html>
